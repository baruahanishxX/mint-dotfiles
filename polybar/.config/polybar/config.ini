[colors]
background = #00000000
text = #e6e6e6
text-dim = #6c7086

; OLD: pill-bg = #1e1e2e (Solid)
; NEW: pill-bg = #CC1e1e2e (Translucent / Glassy)
pill-bg = #CC1e1e2e

pill-fg = #cdd6f4
blue = #89b4fa
purple = #cba6f7
pink = #f5c2e7
red = #f38ba8
green = #a6e3a1
yellow = #f9e2af

[bar/main]
width = 100%
height = 19pt
radius = 0
fixed-center = true
background = ${colors.background}
foreground = ${colors.text}

; Join to top
line-size = 0
border-size = 0
border-color = #00000000

padding-left = 1
padding-right = 1
module-margin = 0

; --- FONTS ---
; Index 1: System (Wifi, Date)
font-0 = "JetBrainsMono Nerd Font:size=9;2"
; Index 2: Rounded Borders ( )
font-1 = "JetBrainsMono Nerd Font:size=14;3" 
; Index 3: Mono (Fixed width for Apps & Battery)
font-2 = "JetBrainsMono Nerd Font Mono:size=14;4"

modules-left = left-end app-title right-end space left-end recent-apps right-end
modules-center = left-end media right-end space left-end-pink xworkspaces right-end-pink
modules-right = left-end pulseaudio space-small backlight space-small eth space-small systray space-small battery space-small date right-end space left-end powermenu right-end

cursor-click = pointer
enable-ipc = true
tray-position = none

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; BASE MODULE
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/base]
format-background = ${colors.pill-bg}
format-padding = 1

[module/left-end]
type = custom/text
format = %{T2}%{T-}
format-foreground = ${colors.pill-bg}

[module/right-end]
type = custom/text
format = %{T2}%{T-}
format-foreground = ${colors.pill-bg}


[module/space]
type = custom/text
format = " "

[module/space-small]
type = custom/text
; 3 Spaces to push Battery away from Bluetooth
format = "   "
format-background = ${colors.pill-bg}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;; MODULES
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

[module/backlight]
inherit = module/base
type = custom/script
interval = 0.2
exec = ~/.config/polybar/brightness.sh
scroll-up = ~/.config/polybar/brightness.sh up
scroll-down = ~/.config/polybar/brightness.sh down
format = <label>
format-background = ${colors.pill-bg}
format-prefix = "󰃠 "
format-prefix-foreground = ${colors.yellow}
label = %output%

[module/app-title]
inherit = module/base
type = custom/script
tail = true
exec = ~/.config/polybar/app-title.sh
format = <label>
format-foreground = ${colors.text}
label = %output%

[module/recent-apps]
type = custom/script
tail = true
exec = ~/.config/polybar/recent-apps.sh
format = <label>
; Force the background to match perfectly
format-background = ${colors.pill-bg}
; use label spacing instead of padding to prevent gaps
label = " %output% "

[module/media]
inherit = module/base
type = custom/script
tail = true
exec = ~/.config/polybar/media-scroll.py
format-foreground = ${colors.pink}

[module/xworkspaces]
type = internal/xworkspaces

; --- GLOBAL STYLE ---
format = <label-state>
; Background: Pastel Purple (Bright but soft)
format-background = #cba6f7
; Foreground: Dark Grey (For separation)
format-foreground = #11111b

; --- ACTIVE (The one you are on) ---
; Bold Black Number = Maximum Visibility
label-active = %index%
label-active-foreground = #11111b
label-active-padding = 1
label-active-font = 3

; --- OCCUPIED (Windows exist here) ---
; Dark Grey Number (Visible but subtle)
label-occupied = %index%
label-occupied-foreground = #585b70
label-occupied-padding = 1
label-occupied-font = 3

; --- EMPTY (Nothing here) ---
; Faded Grey Number
label-empty = %index%
label-empty-foreground = #9ca0b0
label-empty-padding = 1
label-empty-font = 3

[module/pulseaudio]
inherit = module/base
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-background = ${colors.pill-bg}
label-volume = 󰕾 %percentage%%
label-volume-foreground = ${colors.purple}

format-muted = <label-muted>
format-muted-background = ${colors.pill-bg}
label-muted = 󰝟 Muted
label-muted-foreground = ${colors.red}
click-right = pavucontrol

[module/eth]
inherit = module/base
type = internal/network
interface-type = wired
; CHANGE THIS TO YOUR INTERFACE NAME (e.g., eth0, eno1)
interface = eno1
interval = 3

format-connected = <label-connected>
format-connected-background = ${colors.pill-bg}
label-connected = 󰈀   %downspeed%   %upspeed%
label-connected-foreground = ${colors.blue}

format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.pill-bg}
label-disconnected = 󰈂  No Ethernet
label-disconnected-foreground = ${colors.text-dim}

[module/systray]
inherit = module/base
type = internal/tray
tray-size = 50%
tray-spacing = 8px
tray-background = ${colors.pill-bg}

[module/battery]
inherit = module/base
type = internal/battery
battery = BAT1
adapter = ADP1
poll-interval = 5

; --- FORMATS ---
format-charging = <animation-charging> <label-charging>
format-charging-background = ${colors.pill-bg}

format-discharging = <ramp-capacity> <label-discharging>
format-discharging-background = ${colors.pill-bg}

format-full = <label-full>
format-full-prefix = " "
format-full-prefix-font = 3
format-full-prefix-foreground = ${colors.green}
format-full-background = ${colors.pill-bg}

; --- ICONS (Set to Font 3 to avoid cropping) ---
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.green}
ramp-capacity-font = 3

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750
animation-charging-foreground = ${colors.yellow}
animation-charging-font = 3

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 100%

[module/date]
inherit = module/base
type = internal/date
interval = 1
date = %I:%M %p
date-alt = %A, %d %B %Y
label =  %date%
label-foreground = ${colors.text}

[module/powermenu]
inherit = module/base
type = custom/text
format =  
format-foreground = ${colors.red}
click-left = xfce4-session-logout

[settings]
screenchange-reload = true
pseudo-transparency = true

[module/left-end-pink]
type = custom/text
format = %{T2}%{T-}
; Change color to match the new Purple Workspace
format-foreground = #cba6f7

[module/right-end-pink]
type = custom/text
format = %{T2}%{T-}
; Change color to match the new Purple Workspace
format-foreground = #cba6f7
